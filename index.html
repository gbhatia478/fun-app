<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Very Important Potato</title>
  <style>
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      background: #fff3ca;
      color: #493018;
      font: 17px/1.5 system-ui, sans-serif;
      text-align: center;
    }
    main { width: 100%; max-width: 480px; padding: 12px 0; }
    .potato { position: relative; width: 240px; height: 290px; margin: 60px auto 0; }
    .potato svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .character-head { position: absolute; top: -18px; left: 67px; width: 106px; height: 120px; object-fit: contain; transform-origin: 50% 85%; animation: head-bob 1.2s steps(2, end) infinite; }
    .character-head img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .character-head .head-accessories { position: absolute; inset: 0; }
    .accessory { display: none; }
    .potato[data-level="1"] .tie, .potato[data-level="2"] .tie, .potato[data-level="3"] .tie, .potato[data-level="4"] .tie, .potato[data-level="5"] .tie,
    .potato[data-level="2"] .sunglasses, .potato[data-level="3"] .sunglasses, .potato[data-level="4"] .sunglasses, .potato[data-level="5"] .sunglasses,
    .potato[data-level="3"] .hat, .potato[data-level="4"] .hat, .potato[data-level="5"] .hat,
    .potato[data-level="4"] .crown, .potato[data-level="5"] .crown,
    .potato[data-level="5"] .cape { display: inline; }
    .cutout-body { transform-origin: 120px 270px; animation: body-rock 1.2s steps(2, end) infinite; }
    .left-arm { transform-origin: 84px 112px; animation: arm-swing 1.2s steps(2, end) infinite; }
    .right-arm { transform-origin: 156px 112px; animation: arm-swing 1.2s steps(2, end) infinite reverse; }
    @keyframes head-bob { 0%, 100% { transform: translateY(0) rotate(-7deg); } 50% { transform: translateY(4px) rotate(7deg); } }
    @keyframes body-rock { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
    @keyframes arm-swing { 0%, 100% { transform: rotate(-18deg); } 50% { transform: rotate(18deg); } }
    @media (prefers-reduced-motion: reduce) { .character-head, .cutout-body, .left-arm, .right-arm { animation: none; } }
    h1 { font-size: clamp(28px, 6vw, 48px); line-height: 1.15; margin: 24px 0 16px; }
    p { margin: 16px 0; overflow-wrap: break-word; }
    button { width: 100%; min-height: 48px; border: 0; border-radius: 12px; padding: 16px 20px; background: #493018; color: white; font: inherit; cursor: pointer; touch-action: manipulation; }
    @media (hover: hover) { button:hover { background: #70502b; } }
    button:active { background: #70502b; }
    button:focus-visible { outline: 4px solid #b97417; outline-offset: 4px; }
    #status { min-height: 3em; margin: 24px 0 0; }
  </style>
</head>
<body>
  <main>
    <div class="potato" data-level="0" aria-hidden="true">
      <svg viewBox="0 0 240 290" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="120" cy="281" rx="69" ry="6" fill="#493018" opacity=".12" />
        <g class="cutout-body" stroke="#3a3434" stroke-width="1.5" stroke-linejoin="round">
          <path class="accessory cape" d="M87 99 Q120 85 153 99 L182 251 Q120 230 58 251 Z" fill="#a73563" stroke="#762244" />
          <path d="M87 204 L111 204 L111 272 L87 272 Z M129 204 L153 204 L153 272 L129 272 Z" fill="#45414b" />
          <path d="M75 271 H112 V280 H66 V274 Z M128 271 H153 L174 274 V280 H128 Z" fill="#211e24" />
          <g class="left-arm">
            <path d="M84 101 L84 118 L24 126 L21 109 Z" fill="#a69587" />
            <path d="M21 107 L29 124 L18 130 L9 113 Z" fill="#d7ab64" />
          </g>
          <g class="right-arm">
            <path d="M156 101 L219 109 L216 126 L156 118 Z" fill="#a69587" />
            <path d="M219 107 L231 113 L222 130 L211 124 Z" fill="#d7ab64" />
          </g>
          <path d="M84 99 L156 99 L158 210 L82 207 Z" fill="#a69587" />
          <path d="M84 94 L100 94 L100 100 L84 100 Z M140 94 L156 94 L156 100 L140 100 Z" fill="#45414b" />
          <path d="M87 97 H97 M143 97 H153" stroke="#e5c743" stroke-width="3" />
          <g stroke="none">
            <path d="M120 115 H149 V130 H120 Z" fill="#263953" />
            <path d="M120 116 H129 V119 H120 Z M137 121 H149 V124 H137 Z M120 126 H136 V129 H120 Z" fill="#e3c431" />
            <path d="M130 116 H137 V119 H130 Z M120 121 H129 V124 H120 Z M139 126 H149 V129 H139 Z" fill="#c54537" />
          </g>
          <g class="accessory tie" fill="#db493c" stroke="#7f2824">
            <path d="M111 103 H129 L124 113 H116 Z M116 113 H124 L132 159 L120 172 L108 159 Z" />
            <path d="M114 130 L127 143 M112 143 L129 158" fill="none" stroke="#ffd77a" stroke-width="4" />
          </g>
        </g>
      </svg>
      <div class="character-head">
        <img src="assets/samit-head.png" alt="" width="106" height="120">
        <svg class="head-accessories" viewBox="0 0 106 120" xmlns="http://www.w3.org/2000/svg">
          <g class="accessory sunglasses" stroke="#211e24" stroke-width="3" stroke-linejoin="round">
            <path d="M23 59 H49 L46 74 Q33 80 26 71 Z M59 59 H85 L82 71 Q72 80 62 74 Z" fill="#211e24" />
            <path d="M48 62 Q54 58 60 62 M17 59 H24 M85 59 H91" fill="none" />
            <path d="M29 63 L36 63 M65 63 L72 63" stroke="#8ccee2" stroke-width="2" />
          </g>
          <g class="accessory hat" fill="#49305f" stroke="#211e24" stroke-width="2" stroke-linejoin="round">
            <path d="M23 3 L17 -30 H89 L83 3 Z" />
            <path d="M22 -8 H84 L83 2 H23 Z" fill="#ed739d" />
            <ellipse cx="53" cy="4" rx="52" ry="7" />
          </g>
          <g class="accessory crown" fill="#f6c443" stroke="#8c5914" stroke-width="2" stroke-linejoin="round">
            <path d="M28 -30 L23 -49 L40 -40 L53 -54 L66 -40 L83 -49 L78 -30 Z" />
            <path d="M29 -30 H77 V-25 H29 Z" />
            <path d="M53 -41 L57 -36 L53 -31 L49 -36 Z" fill="#db493c" />
          </g>
        </svg>
      </div>
    </div>
    <h1>Very Important Potato</h1>
    <p>This potato has absolutely no responsibilities.</p>
    <button id="button" type="button">Give potato a promotion</button>
    <p id="status" role="status">Current role: Potato Intern</p>
  </main>
  <script>
    const roles = ['Assistant Potato', 'Senior Potato', 'Director of Doing Nothing', 'Chief Couch Potato', 'Supreme Potato of the Universe'];
    const outfits = ['A tie. Very professional.', 'Sunglasses. Too cool to work.', 'An enormous hat. Bigger than the job.', 'A crown on the hat. Naturally.', 'A royal cape. The outfit is complete.'];
    let promotions = 0;
    document.getElementById('button').addEventListener('click', () => {
      const level = promotions % roles.length;
      document.querySelector('.potato').dataset.level = level + 1;
      document.getElementById('status').textContent = 'Current role: ' + roles[level] + '. ' + outfits[level];
      promotions += 1;
    });
  </script>
</body>
</html>
